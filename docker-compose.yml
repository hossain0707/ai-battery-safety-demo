services:
  battery-safety:
    build: .
    ports:
      - "8080:8080"
    environment:
      BATTERY_SAFETY_API_KEY: ${BATTERY_SAFETY_API_KEY:?set BATTERY_SAFETY_API_KEY}
      BATTERY_SAFETY_SITE_PROFILE: grameenphone-aligned-reference
      BATTERY_SAFETY_DB: /app/data/battery_safety.db
    volumes:
      - battery_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  battery_data:
