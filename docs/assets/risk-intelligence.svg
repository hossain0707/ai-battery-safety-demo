<g transform="translate(56 305)" font-family="Inter,Segoe UI,sans-serif"><text fill="#8fa5c2" font-size="12">Operational principle</text><text y="30" fill="#eef6ff" font-size="18" font-weight="700">AI recommends. Operators verify. Certified controls act.</text><text y="58" fill="#8fa5c2" font-size="13">Loss of the AI service must never disable primary battery, UPS or fire protection.</text></g></svg>