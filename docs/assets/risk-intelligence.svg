<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="420" viewBox="0 0 1300 420" role="img" aria-labelledby="title desc"><title id="title">BatteryGuard AI risk intelligence flow</title><desc id="desc">Animated industrial data flow from sensors to AI to operator workflow while safety systems remain authoritative.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#081322"/><stop offset="1" stop-color="#0b1b30"/></linearGradient><linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#43e7a4"/><stop offset=".5" stop-color="#49ddff"/><stop offset="1" stop-color="#8f88ff"/></linearGradient></defs><style>.dash{stroke-dasharray:10 10;animation:dash 2s linear infinite}.pulse{animation:p 1.8s ease-in-out infinite}@keyframes dash{to{stroke-dashoffset:-40}}@keyframes p{0%,100%{opacity:.45}50%{opacity:1}}</style><rect width="1300" height="420" rx="26" fill="url(#bg)"/><text x="56" y="52" fill="#eef6ff" font-size="25" font-family="Inter,Segoe UI,sans-serif" font-weight="800">AI Risk Intelligence + Independent Safety Authority</text><text x="56" y="80" fill="#8fa5c2" font-size="14" font-family="Inter,Segoe UI,sans-serif">AI accelerates awareness and decision support; validated BMS / UPS / PLC / fire systems remain authoritative.</text>
<g font-family="Inter,Segoe UI,sans-serif"><g transform="translate(55 125)"><rect width="210" height="128" rx="18" fill="#0d2134" stroke="#5d7da3" stroke-opacity=".35"/><text x="22" y="32" fill="#a9c0da" font-size="12">SOURCE LAYER</text><text x="22" y="62" fill="#f1f7ff" font-size="18" font-weight="700">Sensors / BMS / UPS</text><text x="22" y="88" fill="#91a7c3" font-size="13">Temperature • Gas • Voltage</text><text x="22" y="108" fill="#91a7c3" font-size="13">Current • Smoke • Alarms</text></g><g transform="translate(330 125)"><rect width="210" height="128" rx="18" fill="#0d2134" stroke="#49ddff" stroke-opacity=".35"/><text x="22" y="32" fill="#a9c0da" font-size="12">EDGE LAYER</text><text x="22" y="62" fill="#f1f7ff" font-size="18" font-weight="700">Secure Gateway</text><text x="22" y="88" fill="#91a7c3" font-size="13">MQTT/TLS • SNMPv3</text><text x="22" y="108" fill="#91a7c3" font-size="13">OPC UA • Read-only Modbus</text></g><g transform="translate(605 125)"><rect width="210" height="128" rx="18" fill="#10223a" stroke="#8f88ff" stroke-opacity=".45"/><text x="22" y="32" fill="#b7addf" font-size="12">INTELLIGENCE LAYER</text><text x="22" y="62" fill="#f1f7ff" font-size="18" font-weight="700">AI Risk Engine</text><text x="22" y="88" fill="#91a7c3" font-size="13">Risk • Explainability</text><text x="22" y="108" fill="#91a7c3" font-size="13">Prediction • Maintenance</text></g><g transform="translate(880 125)"><rect width="210" height="128" rx="18" fill="#0d2134" stroke="#43e7a4" stroke-opacity=".35"/><text x="22" y="32" fill="#a9c0da" font-size="12">OPERATIONS LAYER</text><text x="22" y="62" fill="#f1f7ff" font-size="18" font-weight="700">NOC / CMMS / SIEM</text><text x="22" y="88" fill="#91a7c3" font-size="13">Alert • Verify • Dispatch</text><text x="22" y="108" fill="#91a7c3" font-size="13">Acknowledge • Audit</text></g><g transform="translate(1080 294)"><rect x="-100" width="260" height="80" rx="16" fill="#21151a" stroke="#ff6572" stroke-opacity=".48"/><text x="-78" y="28" fill="#ffc2c8" font-size="12">INDEPENDENT SAFETY AUTHORITY</text><text x="-78" y="55" fill="#fff1f3" font-size="17" font-weight="700">BMS / PLC / Fire Controls</text></g></g>
