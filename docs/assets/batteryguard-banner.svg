<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img" aria-labelledby="title desc">
<title id="title">BatteryGuard AI</title><desc id="desc">Animated banner for AI-powered battery safety intelligence.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#06101c"/><stop offset="55%" stop-color="#0b1930"/><stop offset="100%" stop-color="#071221"/></linearGradient><linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#43e7a4"/><stop offset="50%" stop-color="#49ddff"/><stop offset="100%" stop-color="#8f88ff"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#8db5e6" stroke-opacity=".08"/></pattern></defs>
<style>.scan{animation:scan 5s linear infinite}.pulse{animation:pulse 2s ease-in-out infinite}.flow1{animation:flow 2.4s linear infinite}.flow2{animation:flow 2.4s linear infinite .8s}.flow3{animation:flow 2.4s linear infinite 1.6s}@keyframes scan{0%{transform:translateX(-260px)}100%{transform:translateX(1450px)}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes flow{0%{opacity:0;transform:translateX(0)}20%{opacity:1}100%{opacity:0;transform:translateX(145px)}}</style>
<rect width="1400" height="360" rx="28" fill="url(#bg)"/><rect width="1400" height="360" rx="28" fill="url(#grid)"/><circle cx="1180" cy="20" r="330" fill="#49ddff" opacity=".06"/><circle cx="100" cy="340" r="260" fill="#8f88ff" opacity=".05"/>
<g transform="translate(72 72)"><rect width="78" height="128" rx="15" fill="#0e2137" stroke="#49ddff" stroke-opacity=".65" stroke-width="3"/><rect x="22" y="-13" width="34" height="13" rx="4" fill="#49ddff"/><rect x="14" y="18" width="50" height="92" rx="9" fill="#071522" stroke="#5b789d" stroke-opacity=".5"/><rect x="22" y="28" width="34" height="12" rx="5" fill="#43e7a4" class="pulse"/><rect x="22" y="47" width="34" height="12" rx="5" fill="#43e7a4" class="pulse" style="animation-delay:.25s"/><rect x="22" y="66" width="34" height="12" rx="5" fill="#ffc65c" class="pulse" style="animation-delay:.5s"/><rect x="22" y="85" width="34" height="12" rx="5" fill="#49ddff" class="pulse" style="animation-delay:.75s"/></g>
<g transform="translate(196 85)"><text x="0" y="38" fill="#f2f8ff" font-size="53" font-family="Inter,Segoe UI,sans-serif" font-weight="800">BatteryGuard AI</text><text x="2" y="82" fill="url(#brand)" font-size="29" font-family="Inter,Segoe UI,sans-serif" font-weight="700">Predict. Prevent. Protect.</text><text x="2" y="120" fill="#9fb3ce" font-size="18" font-family="Inter,Segoe UI,sans-serif">AI-powered early-warning intelligence for mission-critical telecom &amp; data-center batteries</text><g transform="translate(2 154)"><rect width="150" height="34" rx="17" fill="#43e7a4" fill-opacity=".10" stroke="#43e7a4" stroke-opacity=".28"/><circle cx="20" cy="17" r="5" fill="#43e7a4" filter="url(#glow)" class="pulse"/><text x="34" y="22" fill="#bdf9df" font-size="13" font-family="Inter,Segoe UI,sans-serif" font-weight="700">EARLY WARNING</text><rect x="164" width="170" height="34" rx="17" fill="#49ddff" fill-opacity=".10" stroke="#49ddff" stroke-opacity=".28"/><text x="185" y="22" fill="#c5f2ff" font-size="13" font-family="Inter,Segoe UI,sans-serif" font-weight="700">EXPLAINABLE AI</text><rect x="348" width="202" height="34" rx="17" fill="#8f88ff" fill-opacity=".10" stroke="#8f88ff" stroke-opacity=".28"/><text x="369" y="22" fill="#ddd9ff" font-size="13" font-family="Inter,Segoe UI,sans-serif" font-weight="700">ADVISORY-FIRST SAFETY</text></g></g>
<g transform="translate(930 82)"><rect width="380" height="190" rx="22" fill="#091625" fill-opacity=".86" stroke="#7ea0cb" stroke-opacity=".18"/><text x="26" y="34" fill="#91a7c4" font-size="13" font-family="Inter,Segoe UI,sans-serif">LIVE RISK INTELLIGENCE</text><text x="26" y="83" fill="#f2f8ff" font-size="42" font-family="Inter,Segoe UI,sans-serif" font-weight="800">0.08</text><text x="129" y="80" fill="#43e7a4" font-size="15" font-family="Inter,Segoe UI,sans-serif" font-weight="700">NORMAL</text><path d="M28 137 C88 128,130 142,180 118 S260 102,345 54" fill="none" stroke="url(#brand)" stroke-width="4"/><circle cx="345" cy="54" r="6" fill="#ffc65c" class="pulse"/><circle cx="345" cy="54" r="15" fill="none" stroke="#ffc65c" stroke-opacity=".3" class="pulse"/></g>
